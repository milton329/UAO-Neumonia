[project]
name = "uao-neumonia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "img2pdf>=0.6.3",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.3",
    "pillow>=12.3.0",
    "pyautogui>=0.9.54",
    "pydicom>=3.0.2",
    "python-xlib>=0.33 ; sys_platform == 'linux'",
    "pywin32>=306 ; sys_platform == 'win32'",
    "tensorflow>=2.21.0",
    "tkcap>=0.0.4",
    "ttkbootstrap>=2.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
# "." en pythonpath: el paquete "app" (con los módulos detector_neumonia.py,
# integrator.py, etc.) vive en la raíz del repo, no está instalado, así que
# pytest necesita la raíz en sys.path para poder importar "app.X" desde tests/.
pythonpath = ["."]
testpaths = ["tests"]
